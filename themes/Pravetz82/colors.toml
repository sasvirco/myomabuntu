# Pravetz82 — a green monochrome monitor of the Pravetz 82 era.
# Inspired by Phosphor Green (github.com/squatchware/omarchy-phosphor-green-theme). Palette:
#  - one P1 phosphor green (#33FF33, 525 nm, the Apple II-era green screen) on dark glass;
#  - a monochrome screen shows colours only as brightness, so each terminal colour is the
#    green shade matching its grey value, and bright colours bloom toward white;
#  - selection is INVERSE (dark text on a solid green bar), as on the Apple II / Pravetz 82;
#  - muted is the phosphor at half drive.
mode = "dark"

accent               = "#33FF33"
cursor               = "#33FF33"
foreground           = "#33FF33"
background           = "#060D06"
dark_background      = "#040804"
darker_background    = "#000000"
