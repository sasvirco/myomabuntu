monitor = , preferred, auto, auto
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/theme.conf   # written by: hypr-tools.sh theme-set <name>

input {
    kb_layout = us
    kb_variant =
    kb_options =
    touchpad {
        natural_scroll = true
    }
}

exec-once = waybar
exec-once = mako
exec-once = swayosd-server
exec-once = hypridle
exec-once = /usr/libexec/hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill

$mod = SUPER
$tools = ~/.config/hypr/scripts/hypr-tools.sh
# bindd = MODS, key, description, dispatcher[, args]   (Super+K lists them)

# Apps
bindd = $mod, Return, Terminal, exec, alacritty
bindd = $mod SHIFT, Return, New terminal tab, exec, ~/.config/hypr/scripts/new-tab.sh
bindd = $mod ALT, Return, Tmux, exec, alacritty -e tmux new-session -A -s Work
bindd = $mod, Space, Launch apps, exec, fuzzel
bindd = $mod SHIFT, B, Browser, exec, google-chrome
bindd = $mod SHIFT ALT, B, Browser (private), exec, google-chrome --incognito
bindd = $mod SHIFT, F, File manager, exec, nautilus --new-window
bindd = $mod SHIFT, N, Editor, exec, code
bindd = $mod SHIFT, slash, Passwords, exec, 1password
bindd = $mod SHIFT, G, Signal, exec, signal-desktop
bindd = $mod SHIFT, M, Music, exec, $tools webapp https://open.spotify.com
bindd = $mod SHIFT, A, ChatGPT, exec, $tools webapp https://chatgpt.com
bindd = $mod SHIFT ALT, A, Grok, exec, $tools webapp https://grok.com
bindd = $mod SHIFT, C, Calendar, exec, $tools webapp https://calendar.google.com
bindd = $mod SHIFT, E, Email, exec, $tools webapp https://mail.google.com
bindd = $mod SHIFT, Y, YouTube, exec, $tools webapp https://youtube.com
bindd = $mod SHIFT ALT, G, WhatsApp, exec, $tools webapp https://web.whatsapp.com
bindd = $mod SHIFT CTRL, G, Google Messages, exec, $tools webapp https://messages.google.com/web/conversations
bindd = $mod SHIFT, P, Google Photos, exec, $tools webapp https://photos.google.com
bindd = $mod SHIFT, X, X, exec, $tools webapp https://x.com
bindd = $mod SHIFT ALT, X, X post, exec, $tools webapp https://x.com/compose/post
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# System
bindd = $mod, Escape, System menu, exec, ~/.config/hypr/scripts/system-menu.sh
bindd = $mod CTRL, L, Lock, exec, loginctl lock-session
bindd = $mod, K, Show key bindings, exec, $tools keybindings
bindd = $mod CTRL, I, Toggle locking on idle, exec, $tools idle-toggle
bindd = $mod SHIFT, Space, Toggle top bar, exec, $tools toggle-bar
bindd = $mod CTRL, Space, Background menu, exec, $tools background-menu
bindd = $mod SHIFT CTRL, Space, Theme menu, exec, $tools theme-menu
bindd = $mod CTRL, A, Audio controls, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center sound
bindd = $mod CTRL, B, Bluetooth controls, exec, blueman-manager
bindd = $mod CTRL, W, Wi-Fi controls, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center wifi
bindd = $mod CTRL, T, Activity, exec, alacritty -e btop
bindd = $mod CTRL, E, Emoji picker, exec, gnome-characters
bindd = $mod CTRL ALT, T, Show time, exec, $tools show-time
bindd = $mod CTRL ALT, B, Show battery, exec, $tools show-battery
bindd = $mod CTRL, Z, Zoom in, exec, $tools zoom-in
bindd = $mod CTRL ALT, Z, Reset zoom, exec, $tools zoom-reset

# Capture
bindd = , Print, Screenshot region to clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = $mod CTRL, C, Capture menu, exec, $tools capture-menu
bindd = $mod, Print, Colour picker, exec, pkill hyprpicker || hyprpicker -a

# Clipboard (Omarchy): copy/paste/cut in any app, including terminals
bindd = $mod, C, Copy, sendshortcut, CTRL, Insert, activewindow
bindd = $mod, V, Paste, sendshortcut, SHIFT, Insert, activewindow
bindd = $mod, X, Cut, sendshortcut, CTRL, X, activewindow
bindd = $mod CTRL, V, Clipboard history, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Windows
bindd = $mod, W, Close window, killactive
bindd = CTRL ALT, Delete, Close all windows, exec, $tools close-all
bindd = $mod, F, Full screen, fullscreen, 0
bindd = $mod CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = $mod ALT, F, Full width, fullscreen, 1
bindd = $mod, T, Toggle floating, togglefloating
bindd = $mod, O, Pop window out (float and pin), exec, $tools pop
bindd = $mod, J, Toggle split, togglesplit
bindd = $mod, P, Pseudo tile, pseudo
bindd = $mod, L, Toggle layout (dwindle/master), exec, $tools layout-toggle
bindd = $mod, left, Focus left, movefocus, l
bindd = $mod, right, Focus right, movefocus, r
bindd = $mod, up, Focus up, movefocus, u
bindd = $mod, down, Focus down, movefocus, d
bindd = $mod SHIFT, left, Swap window left, swapwindow, l
bindd = $mod SHIFT, right, Swap window right, swapwindow, r
bindd = $mod SHIFT, up, Swap window up, swapwindow, u
bindd = $mod SHIFT, down, Swap window down, swapwindow, d
bindd = $mod, code:20, Shrink width, resizeactive, -100 0
bindd = $mod, code:21, Grow width, resizeactive, 100 0
bindd = $mod SHIFT, code:20, Shrink height, resizeactive, 0 -100
bindd = $mod SHIFT, code:21, Grow height, resizeactive, 0 100
bindd = ALT, Tab, Next window, cyclenext
bindd = ALT SHIFT, Tab, Previous window, cyclenext, prev
bindd = ALT, Tab, Bring window to top, bringactivetotop
bindd = ALT SHIFT, Tab, Bring window to top, bringactivetotop
bindd = $mod, BackSpace, Toggle transparency, exec, $tools transparency
bindd = $mod SHIFT, BackSpace, Toggle gaps, exec, $tools gaps-toggle
bindd = $mod CTRL, BackSpace, Toggle single-window square aspect, exec, $tools aspect-toggle
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# Groups (tabs)
bindd = $mod, G, Toggle group, togglegroup
bindd = $mod ALT, G, Move out of group, moveoutofgroup
bindd = $mod ALT, left, Move into group left, moveintogroup, l
bindd = $mod ALT, right, Move into group right, moveintogroup, r
bindd = $mod ALT, up, Move into group up, moveintogroup, u
bindd = $mod ALT, down, Move into group down, moveintogroup, d
bindd = $mod ALT, Tab, Next tab, changegroupactive, f
bindd = $mod ALT SHIFT, Tab, Previous tab, changegroupactive, b
bindd = $mod CTRL, left, Previous tab, changegroupactive, b
bindd = $mod CTRL, right, Next tab, changegroupactive, f
bindd = $mod ALT, mouse_down, Next tab, changegroupactive, f
bindd = $mod ALT, mouse_up, Previous tab, changegroupactive, b
bindd = $mod ALT, code:10, Tab 1, changegroupactive, 1
bindd = $mod ALT, code:11, Tab 2, changegroupactive, 2
bindd = $mod ALT, code:12, Tab 3, changegroupactive, 3
bindd = $mod ALT, code:13, Tab 4, changegroupactive, 4
bindd = $mod ALT, code:14, Tab 5, changegroupactive, 5

# Workspaces (number-row keycodes, so they work in non-US layouts too)
bindd = $mod, code:10, Workspace 1, workspace, 1
bindd = $mod, code:11, Workspace 2, workspace, 2
bindd = $mod, code:12, Workspace 3, workspace, 3
bindd = $mod, code:13, Workspace 4, workspace, 4
bindd = $mod, code:14, Workspace 5, workspace, 5
bindd = $mod, code:15, Workspace 6, workspace, 6
bindd = $mod, code:16, Workspace 7, workspace, 7
bindd = $mod, code:17, Workspace 8, workspace, 8
bindd = $mod, code:18, Workspace 9, workspace, 9
bindd = $mod, code:19, Workspace 10, workspace, 10
bindd = $mod SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10
bindd = $mod SHIFT ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = $mod SHIFT ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = $mod SHIFT ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = $mod SHIFT ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = $mod SHIFT ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = $mod SHIFT ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = $mod SHIFT ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = $mod SHIFT ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = $mod SHIFT ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = $mod SHIFT ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10
bindd = $mod, Tab, Next workspace, workspace, e+1
bindd = $mod SHIFT, Tab, Previous workspace, workspace, e-1
bindd = $mod CTRL, Tab, Former workspace, workspace, previous
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1
bindd = $mod, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mod ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Monitors
bindd = CTRL ALT, Tab, Focus next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, Tab, Focus previous monitor, focusmonitor, -1
bindd = $mod SHIFT ALT, left, Move workspace to monitor left, movecurrentworkspacetomonitor, l
bindd = $mod SHIFT ALT, right, Move workspace to monitor right, movecurrentworkspacetomonitor, r
bindd = $mod SHIFT ALT, up, Move workspace to monitor up, movecurrentworkspacetomonitor, u
bindd = $mod SHIFT ALT, down, Move workspace to monitor down, movecurrentworkspacetomonitor, d
bindd = $mod, code:61, Cycle display scaling, exec, $tools scale-cycle
bindd = $mod ALT, code:61, Cycle display scaling back, exec, $tools scale-cycle --reverse
bindd = $mod CTRL, Delete, Toggle laptop display, exec, $tools internal-display toggle
bindd = $mod CTRL ALT, Delete, Toggle display mirroring, exec, $tools mirror-toggle
bindl = , switch:on:Lid Switch, exec, $tools lid close
bindl = , switch:off:Lid Switch, exec, $tools lid open

# Notifications
bindd = $mod, comma, Dismiss notification, exec, makoctl dismiss
bindd = $mod SHIFT, comma, Dismiss all notifications, exec, makoctl dismiss --all
bindd = $mod ALT, comma, Invoke last notification, exec, makoctl invoke
bindd = $mod SHIFT ALT, comma, Restore last notification, exec, makoctl restore

# Media and hardware keys
bindeld = , XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindeld = , XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindld = , XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle
bindld = $mod, XF86AudioMute, Switch audio output, exec, $tools audio-output-switch
bindeld = , XF86MonBrightnessUp, Brightness up, exec, $tools brightness raise
bindeld = , XF86MonBrightnessDown, Brightness down, exec, $tools brightness lower
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, $tools brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, $tools brightness -1
bindld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, $tools brightness 100
bindld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, $tools brightness 1
bindeld = , XF86KbdBrightnessUp, Keyboard brightness up, exec, $tools kbd-brightness up
bindeld = , XF86KbdBrightnessDown, Keyboard brightness down, exec, $tools kbd-brightness down
bindld = , XF86KbdLightOnOff, Keyboard backlight cycle, exec, $tools kbd-brightness cycle
bindld = , XF86TouchpadToggle, Toggle touchpad, exec, $tools touchpad toggle
bindld = , XF86TouchpadOn, Enable touchpad, exec, $tools touchpad on
bindld = , XF86TouchpadOff, Disable touchpad, exec, $tools touchpad off
bindld = , XF86AudioPlay, Play/pause, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
bindld = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl previous
