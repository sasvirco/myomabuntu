# Written by myomabuntu, adapted from Omarchy. Colours come from theme.toml,
# which `hypr-tools.sh theme-set` rewrites (Alacritty reloads it on its own).
general.import = [ "~/.config/alacritty/theme.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 13

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
# Super+C / Super+V in Hyprland send these.
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can tell it apart from Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]
